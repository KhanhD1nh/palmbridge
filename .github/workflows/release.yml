name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: graft-macos-aarch64
          - os: ubuntu-24.04
            asset: graft-linux-x86_64
          - os: windows-latest
            asset: graft-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Read grok-build revision
        id: grok
        shell: bash
        run: echo "rev=$(tr -d '[:space:]' < GROK_BUILD_REVISION)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: xai-org/grok-build
          path: .grok-build
          ref: ${{ steps.grok.outputs.rev }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject crate (Unix)
        if: runner.os != 'Windows'
        run: python3 scripts/inject.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.grok-build"

      - name: Inject crate (Windows)
        if: runner.os == 'Windows'
        run: python scripts/inject.py $env:GITHUB_WORKSPACE $env:GITHUB_WORKSPACE\.grok-build

      - name: Apply Windows proto patch
        if: runner.os == 'Windows'
        working-directory: .grok-build
        run: git apply ../scripts/windows-proto-build.patch

      - name: Test
        working-directory: .grok-build
        run: cargo test -p graft

      - name: Clippy
        working-directory: .grok-build
        run: cargo clippy -p graft --all-targets --no-deps

      - name: Build (Unix)
        if: runner.os != 'Windows'
        working-directory: .grok-build
        run: cargo build --release -p graft

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: .grok-build
        shell: pwsh
        run: cargo build --release -p graft

      - name: Pack (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp .grok-build/target/release/graft "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item .grok-build\target\release\graft.exe "dist\${{ matrix.asset }}" -Force

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Flatten
        run: |
          mkdir -p release
          find dist -type f -name 'graft-*' -exec cp {} release/ \;
          cd release
          sha256sum graft-* > SHA256SUMS
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
