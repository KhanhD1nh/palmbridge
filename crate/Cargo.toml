[package]
name = "palmbridge"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Unofficial ChatGPT plugin: local coding tools over MCP. No model."
publish = false

[[bin]]
name = "palmbridge"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
futures-util = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "io-std",
    "net",
    "sync",
    "time",
] }
tokio-tungstenite = { workspace = true }
xai-grok-tools = { path = "../xai-grok-tools" }

[lints]
workspace = true
